    </circle>
    <text x="16" y="48" fill="#f8fafc" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="15.5" font-weight="900">DEADCOW-STORE</text>
    <text x="16" y="69" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11">Signed SHA-256 package portal &amp; app manager</text>
    <text x="16" y="85" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5">Unified distribution hub for Android &amp; Desktop apps</text>
    <rect x="16" y="93" width="84" height="14" rx="2" fill="#24200c"/>
    <text x="58" y="103" text-anchor="middle" fill="#ffe600" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700">TYPESCRIPT</text>
    <rect x="106" y="93" width="66" height="14" rx="2" fill="#24200c"/>
    <text x="139" y="103" text-anchor="middle" fill="#ffe600" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700">SHA-256</text>
    <rect x="178" y="93" width="88" height="14" rx="2" fill="#24200c"/>
    <text x="222" y="103" text-anchor="middle" fill="#00f5ff" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700">CROSS-PLAT</text>
  </g>

  <!-- SLOT 04: CDC ECOSYSTEM -->
  <g transform="translate(468, 190)">
    <rect width="432" height="112" rx="5" fill="#0e1b22" stroke="#1b4534" stroke-width="1.2"/>
    <rect width="432" height="4" fill="#39ff14"/>
    <rect x="14" y="12" width="24" height="3" fill="#1b402f"/>
    <rect x="14" y="18" width="24" height="3" fill="#1b402f"/>
    <text x="48" y="23" fill="#39ff14" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700">SLOT 04 // CYBER PLATFORMS &amp; LABS</text>
    <circle cx="412" cy="19" r="4" fill="#39ff14">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.0s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="48" fill="#f8fafc" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="15.5" font-weight="900">CDC LEARN &amp; CDC MAIL</text>
    <text x="16" y="69" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11">260 cyber/dev courses + Docker CTF labs</text>
    <text x="16" y="85" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10.5">Anonymous anti-spam PGP webmail — zero-tracker RGPD</text>
    <rect x="16" y="93" width="84" height="14" rx="2" fill="#0b2416"/>
    <text x="58" y="103" text-anchor="middle" fill="#39ff14" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700">DOCKER CTF</text>
    <rect x="106" y="93" width="76" height="14" rx="2" fill="#0b2416"/>
    <text x="144" y="103" text-anchor="middle" fill="#00f5ff" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700">PGP / RGPD</text>
    <rect x="188" y="93" width="86" height="14" rx="2" fill="#0b2416"/>
    <text x="231" y="103" text-anchor="middle" fill="#c084fc" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700">CDCLEAK.LOL</text>
  </g>

  <rect width="920" height="318" rx="8" fill="url(#crt-cart)" pointer-events="none"/>
</svg>
