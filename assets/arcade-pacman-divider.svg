<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 32" width="920" height="32" shape-rendering="crispEdges" role="presentation">
  <defs>
    <clipPath id="div-clip">
      <rect x="10" y="4" width="900" height="24"/>
    </clipPath>
  </defs>

  <rect width="920" height="32" fill="#060814"/>
  <!-- Neon Arcade Corridor Walls -->
  <rect x="0" y="2" width="920" height="2" fill="#1d4ed8"/>
  <rect x="0" y="28" width="920" height="2" fill="#1d4ed8"/>
  <rect x="0" y="0" width="10" height="32" fill="#00f5ff"/>
  <rect x="910" y="0" width="10" height="32" fill="#ff2a85"/>

  <g clip-path="url(#div-clip)">
    <!-- Data Pellets -->
    <g fill="#ffe600" fill-opacity="0.78">
      <rect x="36" y="14" width="4" height="4"/>
      <rect x="76" y="14" width="4" height="4"/>
      <rect x="116" y="14" width="4" height="4"/>
      <rect x="156" y="14" width="4" height="4"/>
      <rect x="196" y="14" width="4" height="4"/>
      <rect x="236" y="14" width="4" height="4"/>
      <rect x="276" y="14" width="4" height="4"/>
      <rect x="316" y="14" width="4" height="4"/>
      <rect x="356" y="14" width="4" height="4"/>
      <rect x="396" y="14" width="4" height="4"/>
      <rect x="436" y="14" width="4" height="4"/>
      <rect x="476" y="14" width="4" height="4"/>
      <rect x="516" y="14" width="4" height="4"/>
      <rect x="556" y="14" width="4" height="4"/>
      <rect x="596" y="14" width="4" height="4"/>
      <rect x="636" y="14" width="4" height="4"/>
      <rect x="676" y="14" width="4" height="4"/>
      <rect x="716" y="14" width="4" height="4"/>
      <rect x="756" y="14" width="4" height="4"/>
      <rect x="796" y="14" width="4" height="4"/>
      <rect x="836" y="14" width="4" height="4"/>
      <rect x="876" y="14" width="4" height="4"/>
    </g>

    <!-- Pac-Man Chasing Frightened Cyber Ghost -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="-110 0" to="980 0" dur="6.8s" repeatCount="indefinite"/>

      <!-- Frightened Blue Ghost -->
      <g transform="translate(68, 7)">
        <rect x="4" y="0" width="10" height="2" fill="#2563eb"/>
        <rect x="0" y="2" width="18" height="14" fill="#2563eb"/>
        <rect x="0" y="16" width="4" height="2" fill="#2563eb"/>
        <rect x="7" y="16" width="4" height="2" fill="#2563eb"/>
        <rect x="14" y="16" width="4" height="2" fill="#2563eb"/>
        <rect x="4" y="6" width="3" height="3" fill="#ffe600"/>
        <rect x="11" y="6" width="3" height="3" fill="#ffe600"/>
        <rect x="3" y="12" width="12" height="2" fill="#00f5ff"/>
      </g>

      <!-- Pixel Pac-Man -->
      <g transform="translate(24, 7)">
        <rect x="4" y="0" width="10" height="18" fill="#ffe600"/>
        <rect x="2" y="2" width="14" height="14" fill="#ffe600"/>
        <rect x="0" y="4" width="18" height="10" fill="#ffe600"/>
        <g fill="#060814">
          <rect x="10" y="7" width="8" height="4"/>
          <rect x="13" y="4" width="5" height="10"/>
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="0.3s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- Neon Trail -->
      <rect x="0" y="14" width="16" height="4" fill="#00f5ff" fill-opacity="0.75"/>
    </g>
  </g>
</svg>
