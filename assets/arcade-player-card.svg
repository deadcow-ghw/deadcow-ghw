<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 278" width="920" height="278" role="img" aria-label="Player 1 Select — Hippolyte / deadcow-ghw Cyber Neofetch">
  <defs>
    <pattern id="crt-card" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0"/>
      <rect y="2" width="4" height="2" fill="#000000" fill-opacity="0.18"/>
    </pattern>
    <linearGradient id="card-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Window Frame -->
  <rect width="920" height="278" rx="8" fill="#070914"/>
  <rect x="3" y="36" width="914" height="239" rx="5" fill="#0d1124"/>
  <rect x="0" y="0" width="920" height="3" fill="url(#card-top)"/>
  <rect x="0" y="275" width="920" height="3" fill="url(#card-top)"/>

  <!-- Window Titlebar -->
  <circle cx="22" cy="19" r="5" fill="#ff2a85"/>
  <circle cx="40" cy="19" r="5" fill="#ffe600"/>
  <circle cx="58" cy="19" r="5" fill="#39ff14"/>
  <text x="80" y="23" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="12"><tspan fill="#39ff14" font-weight="700">root@deadcow-ghw</tspan><tspan fill="#64748b">:~$</tspan><tspan dx="7" fill="#e2e8f0">neofetch --player 1 --arcade-cyber</tspan></text>
  <text x="768" y="23" fill="#ffe600" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" font-weight="700">[ PLAYER 1 READY ]</text>

  <!-- Left Character Bay -->
  <rect x="22" y="52" width="232" height="206" rx="5" fill="#080b18" stroke="#24305c" stroke-width="1.5"/>
  <rect x="22" y="52" width="232" height="3" fill="#ffe600"/>
  <rect x="22" y="255" width="232" height="3" fill="#00f5ff"/>

  <text x="138" y="74" text-anchor="middle" fill="#ffe600" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" font-weight="700">★ CLASS: CYBER-DEV</text>

  <!-- Mini Arcade Cabinet Sprite -->
  <g shape-rendering="crispEdges" transform="translate(60, 88)">
    <rect x="16" y="4" width="124" height="86" fill="#131936"/>
    <rect x="16" y="4" width="124" height="4" fill="#00f5ff"/>
    <rect x="16" y="86" width="124" height="4" fill="#ff2a85"/>
    <rect x="22" y="14" width="112" height="66" fill="#060813"/>

    <!-- Animated Mini Pac-Man inside CRT -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 26 0; 0 0" dur="3.1s" repeatCount="indefinite"/>
      <rect x="30" y="34" width="14" height="24" fill="#ffe600"/>
      <rect x="26" y="38" width="22" height="16" fill="#ffe600"/>
      <rect x="38" y="42" width="12" height="8" fill="#060813">
        <animate attributeName="opacity" values="1;0;1" dur="0.32s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="78" y="44" width="6" height="6" fill="#39ff14"/>
    <rect x="94" y="44" width="6" height="6" fill="#00f5ff"/>
    <rect x="110" y="44" width="6" height="6" fill="#ff2a85"/>

    <!-- Control Deck -->
    <rect x="8" y="94" width="140" height="24" fill="#1e254a"/>
    <rect x="8" y="94" width="140" height="3" fill="#a855f7"/>
    <rect x="34" y="88" width="6" height="12" fill="#94a3b8"/>
    <rect x="30" y="80" width="14" height="10" fill="#ff2a85"/>
    <rect x="76" y="102" width="12" height="8" fill="#00f5ff">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="102" width="12" height="8" fill="#ffe600">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="116" y="102" width="12" height="8" fill="#39ff14">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="138" y="230" text-anchor="middle" fill="#00f5ff" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" font-weight="700">DEADCOW.GHW // FR-NODE</text>
  <text x="138" y="246" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="10">STATUS: OPEN TO AUDITS &amp; COLLAB</text>

  <!-- Right Neofetch Telemetry -->
  <text x="278" y="72" fill="#00f5ff" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="15.5" font-weight="700" filter="url(#soft-glow)">hippolyte</text>
  <text x="366" y="72" fill="#ff2a85" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="15.5" font-weight="700">@</text>
  <text x="380" y="72" fill="#ffe600" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="15.5" font-weight="700">deadcow-ghw</text>
  <line x1="278" y1="84" x2="892" y2="84" stroke="#25305c" stroke-width="1.5"/>

  <g font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="12">
    <text x="278" y="108" fill="#ff2a85" font-weight="700">HANDLE</text>
    <text x="376" y="108" fill="#f1f5f9">Hippolyte · DEADCOW.GHW · France (FR)</text>

    <text x="278" y="130" fill="#ff2a85" font-weight="700">ROLE</text>
    <text x="376" y="130" fill="#00f5ff">Full-Stack Engineer · Ethical Pentester · Self-Host Infra</text>

    <text x="278" y="152" fill="#ff2a85" font-weight="700">CODE</text>
    <text x="376" y="152" fill="#39ff14">TypeScript · JavaScript · Python · PHP · PowerShell · Bash · SQL</text>

    <text x="278" y="174" fill="#ff2a85" font-weight="700">OFFSEC</text>
    <text x="376" y="174" fill="#ffe600">Web/API Pentest · OWASP Top 10 · OSINT/CSINT · Burp · Nmap</text>

    <text x="278" y="196" fill="#ff2a85" font-weight="700">INFRA</text>
    <text x="376" y="196" fill="#e2e8f0">Linux · Docker · Proxmox VE · Nginx · Cloudflare · Tor E2EE</text>

    <text x="278" y="218" fill="#ff2a85" font-weight="700">GUILD</text>
    <text x="376" y="218" fill="#c084fc">Founder @ CDCLEAK · Portfolio: hippolytedev.ru</text>
  </g>

  <!-- Neon Arcade Palette LEDs -->
  <text x="278" y="248" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="11" font-weight="700">PALETTE</text>
  <g transform="translate(376, 236)" shape-rendering="crispEdges">
    <rect x="0" y="0" width="28" height="14" fill="#00f5ff"><animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="36" y="0" width="28" height="14" fill="#ff2a85"><animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="72" y="0" width="28" height="14" fill="#ffe600"><animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="108" y="0" width="28" height="14" fill="#39ff14"><animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="144" y="0" width="28" height="14" fill="#a855f7"><animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="180" y="0" width="28" height="14" fill="#ff9f1c"><animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" begin="1.0s" repeatCount="indefinite"/></rect>
  </g>

  <rect width="920" height="278" rx="8" fill="url(#crt-card)" pointer-events="none"/>
</svg>
